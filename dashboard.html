<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><title>Radar de Inversión</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font:15px Arial}.app{max-width:760px;margin:auto;padding:20px}.muted{color:#8f9bb5}h1{margin:0}.card{background:#151d31;border:1px solid #293650;border-radius:15px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between}.score{font-size:25px;font-weight:bold}.buy{color:#25d695}.wait{color:#f4c95d}.avoid{color:#ff6678}.metric{font-size:12px;line-height:1.7;margin-top:9px}.bar{height:6px;background:#0e1628;border-radius:8px;margin-top:10px}.fill{height:100%;background:#25d695;border-radius:8px}.hero{padding:18px;border-radius:18px;background:#17284d;margin:16px 0}</style></head><body><div class="app"><h1>Radar de Inversión</h1><div id="date" class="muted">Cargando...</div><div class="hero"><b>TOP 5 SEMANAL</b><br><span class="muted">CEDEARs y acciones · 1–12 semanas</span></div><div id="list"></div><p class="muted">⚠️ Señales cuantitativas orientativas; no constituyen asesoramiento financiero.</p></div><script>fetch("data/weekly_top5.json?"+Date.now()).then(r=>r.json()).then(x=>{document.getElementById("date").textContent=x.generated_at?"Actualizado: "+new Date(x.generated_at).toLocaleString("es-AR"):"Sin análisis generado";document.getElementById("list").innerHTML=x.top5.map((a,i)=>`<div class="card"><div class="row"><div><b>#${i+1} ${a.ticker}</b><div class="${a.signal.includes("COMPRA")?"buy":a.signal==="ESPERAR"?"wait":"avoid"}">${a.signal}</div></div><b class="score">${a.score}</b></div><div class="bar"><div class="fill" style="width:${a.score}%"></div></div><div class="metric">Confianza: ${a.confidence}% · Precio: ${a.price}<br>Entrada: ${a.entry_low} – ${a.entry_high}<br>Objetivos: ${a.target1} / ${a.target2}<br>Stop: ${a.stop_loss} · R/B: ${a.risk_reward}<br>RSI: ${a.rsi} · 20 ruedas: ${a.ret20}% · Volumen: ${a.volume_ratio}x</div></div>`).join("")}).catch(()=>document.getElementById("list").innerHTML="<div class='card'>No hay informe disponible.</div>");if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
